<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shape Card Maker</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;background:#e8f4fd;color:#333;overflow:hidden}
#S{height:100dvh;display:flex;flex-direction:column}#S[hidden]{display:none}
h1{height:42px;flex:none;margin:0;font-size:20px;padding:0 14px;display:flex;align-items:center;background:#42a5f5;color:#fff}
button{font:inherit;cursor:pointer;border:2px solid #333;border-radius:10px;background:#fff;padding:8px 6px;min-height:42px}
button:active{background:#ffe082}
svg{display:block}
.wrap{flex:1;min-height:0;display:flex;gap:10px;padding:10px}
#box{width:190px;flex:none;display:flex;flex-direction:column;background:#fff;border:4px dashed #42a5f5;border-radius:16px;padding:8px}
#box.over{background:#fff3cd;border-color:#ff9800}
#box h3{margin:0 0 6px;font-size:17px}
#tray{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow:auto;flex:1;min-height:0}
.tr{width:79px;text-align:center;touch-action:none;user-select:none;cursor:grab;background:#f5faff;border-radius:12px;padding:3px}
.tr svg{width:58px;height:58px;margin:auto;pointer-events:none}
.tr b{font-size:17px}
.hint{font-size:13px;color:#666;margin:6px 0 0}
main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
#card{position:relative;width:min(100%,calc((100dvh - 62px)*4/3));aspect-ratio:4/3;border:4px solid #333;border-radius:12px;overflow:hidden;touch-action:none}
#title{position:absolute;top:3%;left:5%;right:5%;width:90%;border:0;background:transparent;text-align:center;font:bold clamp(18px,3.4vw,34px) "Comic Sans MS",sans-serif;color:#333;outline:0}
#title:focus{background:rgba(255,255,255,.5)}
.it{position:absolute;aspect-ratio:1;touch-action:none;cursor:grab;user-select:none}
.it svg{width:100%;height:100%;pointer-events:none}
.it.sel{outline:3px dashed #1976d2;outline-offset:2px}
#panel{width:225px;flex:none;overflow:auto;display:flex;flex-direction:column;gap:8px}
#panel section{background:#fff;border:3px solid #90caf9;border-radius:14px;padding:8px}
#panel h4{margin:0 0 6px;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dot{width:100%;height:auto;aspect-ratio:1;min-height:0;border-radius:50%;padding:0}
.dot.sq{border-radius:8px}
#savepng{width:100%;margin-bottom:6px;background:#66bb6a;color:#fff;font-weight:bold}
#clear{width:100%}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#388e3c;color:#fff;font-size:22px;padding:12px 24px;border-radius:30px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:9}
#toast.on{opacity:1}#toast.bad{background:#f57c00}
@media(max-width:820px){body{overflow:auto}#S{height:auto}.wrap{flex-wrap:wrap}#box{width:100%}main{flex:1 1 100%;order:-1}#card{width:100%}#panel{width:100%}}
</style></head><body>

<div id="S" hidden>
<h1>🎨 Shape Card Maker</h1>
<div class="wrap">
 <aside id="box"><h3>📦 My Shapes</h3><div id="tray"></div>
  <p class="hint" id="empty">Your box is empty. Ask a teacher for shapes! Scan the QR code.</p>
  <p class="hint">Drag a shape onto the card. Drag it back here to put it away.</p></aside>
 <main><div id="card"><input id="title" maxlength="40" placeholder="Type your message here"></div></main>
 <aside id="panel">
  <section><h4>Tap a shape, then:</h4>
   <div class="g2"><button id="big">➕ Bigger</button><button id="small">➖ Smaller</button><button id="turn">🔄 Turn</button><button id="back">📦 Put back</button></div></section>
  <section><h4>Shape color</h4><div id="cols" class="pal"></div></section>
  <section><h4>Card color</h4><div id="bgs" class="pal"></div></section>
  <section><button id="savepng">💾 Save picture</button><button id="clear">🧹 Put all back</button></section>
 </aside>
</div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const star=[...Array(10)].map((_,i)=>{const a=-Math.PI/2+i*Math.PI/5,r=i%2?20:48;return (50+r*Math.cos(a)).toFixed(1)+','+(54+r*Math.sin(a)).toFixed(1)}).join(' ');
const P={circle:'<circle cx="50" cy="50" r="45"/>',square:'<rect x="8" y="8" width="84" height="84" rx="3"/>',
heart:'<path d="M50 90C8 60 4 30 24 17c13-8 24-1 26 11 2-12 13-19 26-11 20 13 16 43-26 73z"/>',
triangle:'<polygon points="50,8 95,90 5,90"/>',rectangle:'<rect x="3" y="25" width="94" height="50" rx="3"/>',
oval:'<ellipse cx="50" cy="50" rx="47" ry="30"/>',diamond:'<polygon points="50,3 93,50 50,97 7,50"/>',star:'<polygon points="'+star+'"/>'};
const COL={circle:'#ef5350',square:'#42a5f5',heart:'#ec407a',triangle:'#66bb6a',rectangle:'#ffa726',oval:'#ab47bc',diamond:'#26c6da',star:'#fdd835'};
const NAMES=Object.keys(P);
const icon=(t,c)=>`<svg viewBox="0 0 100 100" fill="${c}" stroke="#333" stroke-width="3" stroke-linejoin="round">${P[t]}</svg>`;
const word=(t,n)=>t+(n>1?'s':'');
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

studentMode();

/* ---------- STUDENT ---------- */
function studentMode(){
$('#S').hidden=false;
let S=Object.assign({inv:{},used:[],items:[],title:'',bg:'#fffde7',nid:1},ls.get('cardshapes_v1',{}));
let sel=null,drag=null;
const save=()=>ls.set('cardshapes_v1',S);
const card=$('#card'),box=$('#box');
const CC=['#ef5350','#ffa726','#fdd835','#66bb6a','#26c6da','#42a5f5','#ab47bc','#ec407a','#8d6e63','#ffffff'];
const BG=['#fffde7','#e3f2fd','#fce4ec','#e8f5e9','#f3e5f5','#ffffff'];
CC.forEach(c=>{const b=document.createElement('button');b.className='dot';b.style.background=c;b.onclick=()=>{const it=cur();if(it){it.c=c;renderCard();save()}};$('#cols').appendChild(b)});
BG.forEach(c=>{const b=document.createElement('button');b.className='dot sq';b.style.background=c;b.onclick=()=>{S.bg=c;card.style.background=c;save()};$('#bgs').appendChild(b)});
const cur=()=>S.items.find(i=>i.id===sel);
const place=(d,it)=>{d.style.left=it.x*100+'%';d.style.top=it.y*100+'%';d.style.width=it.s*100+'%';d.style.transform=`translate(-50%,-50%) rotate(${it.r}deg)`};

function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='on'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3500)}

function renderTray(){
 const tr=$('#tray');tr.innerHTML='';let any=false;
 NAMES.forEach(t=>{const n=S.inv[t]||0;if(!n)return;any=true;
  const d=document.createElement('div');d.className='tr';d.innerHTML=icon(t,COL[t])+`<b>×${n}</b>`;
  d.onpointerdown=e=>{
   e.preventDefault();
   if(!S.inv[t])return;
   S.inv[t]--;d.querySelector('b').textContent='×'+S.inv[t];
   const it={id:S.nid++,t,x:.5,y:.5,s:.18,c:COL[t],r:0};S.items.push(it);sel=it.id;renderCard();
   drag={it,d:card.querySelector(`[data-id="${it.id}"]`)};move(e)};
  tr.appendChild(d)});
 $('#empty').hidden=any}

function renderCard(){
 card.querySelectorAll('.it').forEach(e=>e.remove());
 S.items.forEach(it=>{
  const d=document.createElement('div');d.className='it'+(it.id===sel?' sel':'');d.dataset.id=it.id;d.innerHTML=icon(it.t,it.c);place(d,it);
  d.onpointerdown=e=>{e.preventDefault();sel=it.id;S.items=S.items.filter(x=>x!==it).concat(it);card.appendChild(d);
   card.querySelectorAll('.it').forEach(x=>x.classList.toggle('sel',x===d));drag={it,d};move(e)};
  card.appendChild(d)});
 card.style.background=S.bg}

function move(e){
 if(!drag)return;
 const r=card.getBoundingClientRect();
 drag.it.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
 drag.it.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
 place(drag.d,drag.it);
 const b=box.getBoundingClientRect();
 box.classList.toggle('over',e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top&&e.clientY<b.bottom)}
function drop(){
 if(!drag)return;
 const it=drag.it;drag=null;
 if(box.classList.contains('over'))putBack(it);
 box.classList.remove('over');renderTray();save()}
document.addEventListener('pointermove',move);
document.addEventListener('pointerup',drop);
document.addEventListener('pointercancel',drop);
card.addEventListener('pointerdown',e=>{if(e.target===card){sel=null;card.querySelectorAll('.it').forEach(x=>x.classList.remove('sel'))}});

function putBack(it){S.inv[it.t]=(S.inv[it.t]||0)+1;S.items=S.items.filter(x=>x!==it);if(sel===it.id)sel=null;renderCard();renderTray();save()}
$('#back').onclick=()=>{const it=cur();if(it)putBack(it)};
$('#big').onclick=()=>{const it=cur();if(it){it.s=Math.min(.7,it.s*1.2);renderCard();save()}};
$('#small').onclick=()=>{const it=cur();if(it){it.s=Math.max(.06,it.s/1.2);renderCard();save()}};
$('#turn').onclick=()=>{const it=cur();if(it){it.r=(it.r+15)%360;renderCard();save()}};
$('#clear').onclick=()=>{[...S.items].forEach(putBack)};
$('#title').value=S.title;$('#title').oninput=e=>{S.title=e.target.value;save()};

$('#savepng').onclick=async()=>{
 const W=1200,H=900,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
 g.fillStyle=S.bg;g.fillRect(0,0,W,H);
 g.fillStyle='#333';g.font='bold 64px "Comic Sans MS",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(S.title,W/2,100,W-100);
 for(const it of S.items){
  const img=new Image(),sz=it.s*W;
  await new Promise(r=>{img.onload=r;img.src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" fill="${it.c}" stroke="#333" stroke-width="3" stroke-linejoin="round">${P[it.t]}</svg>`)});
  g.save();g.translate(it.x*W,it.y*H);g.rotate(it.r*Math.PI/180);g.drawImage(img,-sz/2,-sz/2,sz,sz);g.restore()}
 const a=document.createElement('a');a.download='my-card.png';a.href=cv.toDataURL('image/png');a.click()};

/* get shapes from a scanned link: #g=star-3-abc12 */
function claim(){
 const m=/^#g=([a-z]+)-(\d{1,2})-(\w+)$/.exec(location.hash);
 if(!m)return;
 const [,t,n,id]=m,q=+n;
 history.replaceState(null,'',location.pathname+location.search);
 if(!P[t]||q<1||q>50)return toast('Hmm, this QR code does not work.',1);
 if(S.used.includes(id))return toast('You already used this QR code!',1);
 S.used.push(id);S.inv[t]=(S.inv[t]||0)+q;save();renderTray();
 toast(`🎉 You got ${q} ${word(t,q)}!`)}
renderTray();renderCard();claim();
addEventListener('hashchange',claim);
}

/* ---------- TEACHER ---------- */
function teacherMode(){
$('#T').hidden=false;
let TL=ls.get('cardshapes_t',[]),ts='star',tn=3;
$('#base').value=ls.get('cardshapes_base',location.href.split(/[?#]/)[0]);
$('#base').onchange=()=>{ls.set('cardshapes_base',$('#base').value.trim());list()};
function pick(){
 $('#pick').innerHTML='';
 NAMES.forEach(t=>{const b=document.createElement('button');b.className=t===ts?'on':'';b.innerHTML=icon(t,COL[t])+t;b.onclick=()=>{ts=t;pick()};$('#pick').appendChild(b)});
 $('#nums').innerHTML='';
 for(let n=1;n<=10;n++){const b=document.createElement('button');b.className=n===tn?'on':'';b.textContent=n;b.onclick=()=>{tn=n;pick()};$('#nums').appendChild(b)}}
function qr(url){const q=qrcode(0,'M');q.addData(url);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})}
function list(){
 const L=$('#list');L.innerHTML='';const base=$('#base').value.trim().split(/[?#]/)[0];
 TL.forEach((x,i)=>{
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<div class="qr">${qr(`${base}#g=${x.t}-${x.n}-${x.id}`)}</div><div class="lab">${icon(x.t,COL[x.t])} ×${x.n} ${word(x.t,x.n)}</div><div class="btns noprint"><button>✕ Remove</button></div>`;
  d.querySelector('.qr').onclick=()=>d.classList.toggle('big');
  d.onclick=e=>{if(d.classList.contains('big')&&e.target.closest('.qr')===null)d.classList.remove('big')};
  d.querySelector('.btns button').onclick=()=>{TL.splice(i,1);ls.set('cardshapes_t',TL);list()};
  L.appendChild(d)})}
$('#mk').onclick=()=>{TL.push({t:ts,n:tn,id:Math.random().toString(36).slice(2,7)});ls.set('cardshapes_t',TL);list()};
$('#prt').onclick=()=>print();
$('#clr').onclick=()=>{TL=[];ls.set('cardshapes_t',TL);list()};
pick();list();
}
</script></body></html>
